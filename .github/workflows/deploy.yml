name: Validate and deploy CallNexa

on:
  push:
    branches: [main]

concurrency:
  group: callnexa-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend source
        run: python -m compileall -q backend/app

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -eu
            cd /opt/callingos

            # Remove stale credential storage that used the now-rejected
            # token-in-URL method, and normalize the remote to plain HTTPS.
            git config --global --unset credential.helper || true
            rm -f ~/.git-credentials || true
            git remote set-url origin https://github.com/tzmichasureshmd-bit/CALLING-OS.git

            # Pull using the Actions token as an HTTP auth header (current GitHub method).
            git stash || true
            git -c http.extraHeader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" \
              fetch origin main
            git reset --hard origin/main

            # Backend runtime secrets (required).
            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json
            chmod 600 /opt/callingos/backend/.env /opt/callingos/backend/firebase-service-account.json

            cd /opt/callingos/backend

            # Apply pending database migrations (ordered, fail-fast, recorded).
            docker compose run --rm callingos-backend python migration_runner.py

            # Rebuild and restart. Web Firebase build-args come from the
            # existing docker-compose defaults if WEB_BUILD_ENV is unset.
            docker compose build
            docker compose up -d --remove-orphans
            docker image prune -f

            # Fail the deploy if the backend is not healthy afterward.
            curl --fail --silent --show-error --retry 15 --retry-delay 4 \
              https://api.callingos.tzmicha.com/health/db > /dev/null
            echo "Deploy verified: backend healthy"
