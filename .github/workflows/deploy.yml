name: Validate and deploy CallNexa

on:
  push:
    branches: [main]

concurrency:
  group: callnexa-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend source
        run: python -m compileall -q backend/app

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend/,web/,migrations/"
          target: "/opt/callingos/"
          strip_components: 0
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -eu

            # Write secrets
            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json
            chmod 600 /opt/callingos/backend/.env /opt/callingos/backend/firebase-service-account.json

            cd /opt/callingos/backend

            # Apply pending migrations
            docker compose run --rm callingos-backend python migration_runner.py

            # Rebuild and restart
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            docker image prune -f

            # Health check
            curl --fail --silent --show-error --retry 15 --retry-delay 4 \
              https://api.callingos.tzmicha.com/health/db > /dev/null
            echo "Deploy verified: backend healthy"
