name: Deploy CallingOS to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/callingos
            # Use GitHub token for authentication
            git config --global credential.helper store
            echo "https://${{ secrets.GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials
            
            git stash
            git pull origin main
            
            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json

            # Run pending migrations — continue on error
            cd /opt/callingos/backend
            for f in migrations/*.sql; do
              if [ -f "$f" ]; then
                echo "=== Running $f ==="
                docker run --rm postgres:15-alpine psql \
                  "postgresql://postgres.gjfohkxocurrzbdpybuu:TzMicha%40123@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres" \
                  -f /dev/stdin < "$f" || echo "Migration $f skipped or already applied"
              fi
            done

            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f

            echo "✅ Deploy complete — backend + web rebuilt"
