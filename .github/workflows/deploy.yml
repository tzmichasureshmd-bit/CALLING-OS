name: Deploy CallingOS to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/callingos
            git stash
            git pull origin main

            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json

            # Run pending migrations against Supabase (idempotent — IF NOT EXISTS)
            cd /opt/callingos/backend
            MIGRATION_FAILED=0
            for f in migrations/003_device_health_columns.sql migrations/004_missing_columns.sql migrations/005_superadmin_tables.sql migrations/006_device_reconnect.sql migrations/007_sims_display_name.sql migrations/008_recording_transcript_summary.sql migrations/009_call_notes.sql migrations/010_calls_notes_updated_at.sql migrations/011_recording_size_bytes.sql migrations/012_call_privacy.sql; do
              echo "=== Running $f ==="
              docker run --rm postgres:15-alpine psql \
                "postgresql://postgres.gjfohkxocurrzbdpybuu:TzMicha%40123@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres" \
                -f /dev/stdin < $f
              if [ $? -ne 0 ]; then
                echo "MIGRATION FAILED: $f"
                MIGRATION_FAILED=1
              fi
            done
            if [ $MIGRATION_FAILED -ne 0 ]; then
              echo "One or more migrations failed. Aborting deploy."
              exit 1
            fi

            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f

            echo "✅ Deploy complete — backend + web rebuilt"
