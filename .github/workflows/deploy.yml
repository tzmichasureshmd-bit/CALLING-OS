name: Deploy CallingOS to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/callingos
            git pull origin main

            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json

            # Run pending migrations against Supabase (idempotent — IF NOT EXISTS)
            cd /opt/callingos/backend
            for f in migrations/003_device_health_columns.sql migrations/004_missing_columns.sql migrations/005_superadmin_tables.sql migrations/006_device_reconnect.sql; do
              echo "=== Running $f ==="
              docker run --rm postgres:15-alpine psql \
                "postgresql://postgres.gjfohkxocurrzbdpybuu:TzMicha%40123@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres" \
                -f /dev/stdin < $f || true
            done

            docker compose up -d --build
            docker image prune -f

            echo "✅ Deploy complete — backend + web rebuilt"
