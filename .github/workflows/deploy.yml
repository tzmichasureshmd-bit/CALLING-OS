name: Deploy CallingOS to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/callingos
            git pull origin main

            printf '%s' '${{ secrets.BACKEND_ENV }}' > /opt/callingos/backend/.env
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/callingos/backend/firebase-service-account.json

            cd /opt/callingos/backend
            docker compose up -d --build
            docker image prune -f

            echo "✅ Deploy complete — backend + web rebuilt"
