name: Validate and deploy CallNexa

on:
  push:
    branches: [main]

concurrency:
  group: callnexa-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend source
        run: python -m compileall -q backend/app

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy changed backend source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend/app/,backend/migrations/,backend/migration_runner.py,backend/Dockerfile,backend/docker-compose.yml,web/"
          target: "/opt/callingos/"
          strip_components: 0
          overwrite: true

      - name: Restart containers with new code
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SECRET_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: SECRET_BACKEND_ENV,SECRET_FIREBASE
          script_stop: true
          command_timeout: 25m
          script: |
            set -eu

            # Write runtime secrets using env vars passed via appleboy/ssh-action
            # to avoid shell quoting issues with special characters in JSON/values.
            echo "$SECRET_BACKEND_ENV" > /opt/callingos/backend/.env
            echo "$SECRET_FIREBASE" > /opt/callingos/backend/firebase-service-account.json
            chmod 644 /opt/callingos/backend/.env
            chmod 640 /opt/callingos/backend/firebase-service-account.json
            chown root:10001 /opt/callingos/backend/.env /opt/callingos/backend/firebase-service-account.json

            cd /opt/callingos/backend

            # Rebuild backend image only (web is static, no rebuild needed unless changed)
            docker compose build callingos-backend

            # Stop old container first, then start new one
            docker compose down callingos-backend --remove-orphans || true
            docker rm -f callingos-backend 2>/dev/null || true
            docker compose up -d callingos-backend

            # Clean up old images
            docker image prune -f

            # Give the container time to fully start before health check
            sleep 40

            # Confirm backend is healthy
            curl --fail --silent --show-error --retry 10 --retry-delay 10 \
              https://api.callingos.tzmicha.com/health/db > /dev/null || \
            (docker logs callingos-backend --tail 50 && exit 1)
            echo "Deploy verified: backend healthy"
